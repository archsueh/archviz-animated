name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Verify Consistency
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # One portable kit, one per-repo config — see archviz-diagram's ADR-003.
    # Seven checks: version / SKILL.md byte budget / description routing surface
    # / count claims / reference reachability / undeclared imports / CJK
    # encoding. This repo had no CI at all before this.
    #
    # Note this repo has no pyproject.toml, so the version check anchors on
    # SKILL.md metadata.version against CHANGELOG.md only — which is why the
    # changelog had to exist first. A version gate with nothing to compare
    # against is not a gate.
    - name: Verify Consistency Kit
      run: python3 scripts/check_archviz.py

    # A checker is only a gate if its own failure modes are tested.
    - name: Verify Consistency Kit Checker
      run: python3 scripts/check_archviz.py --self-test

    # Verifies the manifest is installable, not just present. The `deps` check
    # inside the kit already fails on an undeclared import; this step catches
    # what it structurally cannot — a declared name that does not resolve, or a
    # specifier no release satisfies. This is the heaviest manifest in the
    # family (matplotlib + numpy + scipy), but only render_yang_mills.py needs
    # those three.
    - name: Install declared dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Byte-compilation used to be its own `compileall -q scripts` step here. It
    # now lives in the consistency kit's `pycompile` check, which walks the whole
    # repo rather than one directory and uses the builtin `compile()`, so it
    # leaves no `__pycache__` in the tree it inspects. Measured 2026-10-09: the
    # narrow version could not see examples/ or templates/python/, and the
    # family's only broken file lived in one of them.
